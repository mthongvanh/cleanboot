name: cleanboot
description: "Clean architecture bootstrap framework for Flutter"
publish_to: 'none'
version: 0.1.8

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  flutter_localizations:
    sdk: flutter

  flutter_dotenv: ^5.1.0

  cached_network_image:

  equatable: ^2.0.5

  cloud_firestore: ^4.15.10
  firebase_core: ^2.27.2
  firebase_auth: ^4.18.0
  firebase_crashlytics: any
  firebase_performance: ^0.9.4+7

  flutter_animate: ^4.5.0
  flutter_secure_storage: ^9.0.0

  get_it: ^7.6.7
  go_router: ^13.2.0

  http: ^1.2.1
  hive_flutter: ^1.1.0

  intl: ^0.19.0

  json_annotation: ^4.8.1

  lottie: ^3.1.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  build_runner: ^2.4.9
  json_serializable: ^6.7.1
  mockito: ^5.4.4

flutter:
  uses-material-design: true

  generate: true
